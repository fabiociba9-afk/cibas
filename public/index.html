// Limpeza de Service Workers antigos/conflitantes na raiz (/)
// Garante que o ambiente do Google AI Studio e Preview fiquem 100% livres de conflitos
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then((registrations) => {
    for (const registration of registrations) {
      const scope = registration.scope || '';
      // Desregistra qualquer Service Worker legado na raiz que aponte para firebase-messaging-sw.js
      if (!scope.includes('/push/')) {
        const swUrl = registration.active?.scriptURL || registration.installing?.scriptURL || registration.waiting?.scriptURL || '';
        if (swUrl.includes('firebase-messaging-sw.js')) {
          console.log('[SW Cleanup] Desregistrando Service Worker conflitante na raiz:', scope);
          registration.unregister().catch(console.warn);
        }
      }
    }
  }).catch((err) => {
    console.warn('[SW Cleanup] Aviso ao verificar registros:', err);
  });
}

// 3. UTILITÁRIOS
function formatCurrency(val) {
  const num = Number(val) || 0;
  return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatDate(timestamp) {
  if (!timestamp) return '-';
  const d = new Date(Number(timestamp));
  if (isNaN(d.getTime())) return '-';
  return d.toLocaleString('pt-BR', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const bgColors = {
    info: 'bg-[#132F54] border-[#1B3B66] text-white',
    success: 'bg-[#064E3B] border-[#059669] text-white',
    error: 'bg-[#7F1D1D] border-[#DC2626] text-white',
    warning: 'bg-[#78350F] border-[#D97706] text-white'
  };

  toast.className = `px-4 py-3 rounded-xl border shadow-2xl flex items-center space-x-3 text-sm font-semibold pointer-events-auto transition-all transform duration-300 translate-y-2 opacity-0 ${bgColors[type] || bgColors.info}`;
  toast.innerHTML = `
    <span>${message}</span>
  `;

  container.appendChild(toast);
  requestAnimationFrame(() => {
    toast.classList.remove('translate-y-2', 'opacity-0');
  });

  setTimeout(() => {
    toast.classList.add('opacity-0', 'translate-y-2');
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

// 4. INICIALIZAÇÃO DE LISTENERS EM TEMPO REAL (FIRESTORE)
function startRealtimeSync() {
  // Limpa listeners anteriores
  state.unsubscribeListeners.forEach(unsub => unsub && unsub());
  state.unsubscribeListeners = [];

  const role = (state.userProfile?.role || 'ADMIN').toUpperCase();
  const isCompany = role === 'COMPANY';
  const companyId = state.userProfile?.companyId;
  const isDriver = role === 'DRIVER';
  const driverId = state.userProfile?.id;
  const isAdmin = role === 'ADMIN';

  // Se for empresa e estiver em aba não corporativa, redireciona para o portal da empresa
  if (isCompany) {
    if (!state.currentTab || state.currentTab === 'dashboard' || ['companies', 'drivers', 'financial', 'passengers', 'routes', 'users'].includes(state.currentTab)) {
      state.currentTab = 'company-dashboard';
    }
  }

  // 1. Trips (ISOLAMENTO ESTRITO: se for empresa, query exclusivamente com where companyId == companyId)
  let tripsQuery = db.collection('trips');
  if (isCompany && companyId) {
    tripsQuery = db.collection('trips').where('companyId', '==', companyId);
  } else if (isDriver && driverId) {
    tripsQuery = db.collection('trips').where('driverId', '==', driverId);
  }

  const unsubTrips = tripsQuery.onSnapshot(snapshot => {
    let list = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
    if (isCompany && companyId) {
      list = list.filter(t => t.companyId === companyId);
    } else if (isDriver && driverId) {
      list = list.filter(t => t.driverId === driverId);
    }
    state.trips = list.sort((a, b) => (b.scheduledTime || 0) - (a.scheduledTime || 0));
    renderMainApp();
  }, err => console.error("Erro ouvindo viagens:", err));
  state.unsubscribeListeners.push(unsubTrips);

  // 2. Companies (ISOLAMENTO ESTRITO: empresa só tem acesso ao documento de sua própria empresa)
  if (isCompany && companyId) {
    const unsubCompanies = db.collection('companies').doc(companyId).onSnapshot(doc => {
      if (doc.exists) {
        state.companies = [{ id: doc.id, ...doc.data() }];
      } else {
        state.companies = [];
      }
      renderMainApp();
    }, err => console.error("Erro ouvindo empresa corporativa:", err));
    state.unsubscribeListeners.push(unsubCompanies);
  } else if (isAdmin) {
    const unsubCompanies = db.collection('companies').onSnapshot(snapshot => {
      state.companies = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))
        .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      renderMainApp();
    }, err => console.error("Erro ouvindo empresas:", err));
    state.unsubscribeListeners.push(unsubCompanies);
  } else {
    state.companies = [];
  }

  // 3. Passengers (ISOLAMENTO ESTRITO: empresa só tem acesso aos seus próprios passageiros)
  if (isCompany && companyId) {
    const unsubPassengers = db.collection('passengers').where('companyId', '==', companyId).onSnapshot(snapshot => {
      state.passengers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))
        .filter(p => p.companyId === companyId)
        .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      renderMainApp();
    }, err => console.error("Erro ouvindo passageiros da empresa:", err));
    state.unsubscribeListeners.push(unsubPassengers);
  } else if (isAdmin) {
    const unsubPassengers = db.collection('passengers').onSnapshot(snapshot => {
      state.passengers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderMainApp();
    }, err => console.error("Erro ouvindo passageiros:", err));
    state.unsubscribeListeners.push(unsubPassengers);
  } else {
    state.passengers = [];
  }

  // 4. Drivers (necessário para admin e para exibir dados do motorista nas corridas)
  const unsubDrivers = db.collection('users').where('role', '==', 'DRIVER').onSnapshot(snapshot => {
    state.drivers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))
      .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    renderMainApp();
  }, err => console.error("Erro ouvindo motoristas:", err));
  state.unsubscribeListeners.push(unsubDrivers);

  // 4.1 Driver Locations (Telemetria em tempo real)
  const unsubDriverLocs = db.collection('driver_locations').onSnapshot(snapshot => {
    state.driverLocations = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    if (typeof updateLiveMapMarkers === 'function') {
      updateLiveMapMarkers();
    }
  }, err => console.error("Erro ouvindo driver_locations:", err));
  state.unsubscribeListeners.push(unsubDriverLocs);

  // 5. Users (ISOLAMENTO ESTRITO: apenas administradores têm acesso à lista completa de usuários)
  if (isAdmin) {
    const unsubUsers = db.collection('users').onSnapshot(snapshot => {
      state.users = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))
        .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      renderMainApp();
    }, err => console.error("Erro ouvindo usuários:", err));
    state.unsubscribeListeners.push(unsubUsers);
  } else {
    state.users = state.userProfile ? [state.userProfile] : [];
  }

  // 6. Routes & FareBands (tabela pública de tarifas para consulta de preços)
  const unsubRoutes = db.collection('routes').onSnapshot(snapshot => {
    state.routes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderMainApp();
  }, err => console.error("Erro ouvindo rotas:", err));
  state.unsubscribeListeners.push(unsubRoutes);

  const unsubFareBands = db.collection('fare_bands').onSnapshot(snapshot => {
    state.fareBands = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderMainApp();
  }, err => console.error("Erro ouvindo faixas:", err));
  state.unsubscribeListeners.push(unsubFareBands);

  // Listen Notifications em tempo real para usuário logado (Toast + Notificação de Navegador)
  const webSessionStart = Date.now();
  const unsubNotifications = db.collection('notifications')
    .where('createdAt', '>=', webSessionStart)
    .onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === 'added') {
          const notif = change.doc.data();
          const me = state.userProfile || state.currentUser;
          const myUid = state.currentUser?.uid || '';
          const myRole = me?.role || '';
          const myCompany = me?.companyId || '';

          // Se notif.userId estiver presente, é estritamente para aquele usuário individual
          const isForMe = notif.userId
            ? notif.userId === myUid
            : (
                (notif.role && (notif.role || '').toUpperCase() === (myRole || '').toUpperCase()) ||
                (notif.companyId && notif.companyId === myCompany)
              );

          if (isForMe) {
            // Deduplicação em memória (janela de 7s) para evitar alertas repetidos
            window._recentWebNotifs = window._recentWebNotifs || {};
            const notifKey = `${notif.title || ''}|${notif.body || ''}|${notif.tripId || ''}`;
            const nowTime = Date.now();
            if (window._recentWebNotifs[notifKey] && (nowTime - window._recentWebNotifs[notifKey] < 7000)) {
              return;
            }
            window._recentWebNotifs[notifKey] = nowTime;

            showToast(`🔔 ${notif.title}: ${notif.body}`, 'info');
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
              try {
                new Notification(notif.title, {
                  body: notif.body,
                  icon: '/assets/logo.png',
                  badge: '/assets/logo_transparent.png'
                });
              } catch (e) {
                console.warn('Erro ao exibir notificação web nativa:', e);
              }
            }
          }
        }
      });
    }, err => console.error("Erro ouvindo notificações:", err));
  state.unsubscribeListeners.push(unsubNotifications);
}

// ==========================================
// DISPATCH DE NOTIFICAÇÕES & PUSH (9 CENÁRIOS)
// ==========================================
async function dispatchWebNotification({ userId = null, role = null, companyId = null, title, body, tripId = '', type = 'NOTIFICATION' }) {
  try {
    const now = Date.now();

    // 1. Notificação para usuário individual específico
    if (userId) {
      const user = (state.users || []).find(u => u.id === userId) || (state.drivers || []).find(d => d.id === userId);
      const token = user?.fcmToken || user?.fcmTokenAndroid || user?.fcmTokenWeb || '';
      await db.collection('notifications').add({
        userId,
        driverId: userId,
        driverName: user?.name || '',
        userName: user?.name || '',
        role: user?.role || '',
        companyId: user?.companyId || '',
        fcmToken: token,
        title,
        body,
        tripId: String(tripId || ''),
        type,
        read: false,
        createdAt: now
      });
    }

    // 2. Notificação para papel/role (ADMIN, DRIVER) - Registro único para evitar duplicações
    if (!userId && role) {
      await db.collection('notifications').add({
        role: role.toUpperCase(),
        title,
        body,
        tripId: String(tripId || ''),
        type,
        read: false,
        createdAt: now
      });
    }

    // 3. Notificação para empresa - Registro único
    if (!userId && !role && companyId) {
      await db.collection('notifications').add({
        companyId,
        title,
        body,
        tripId: String(tripId || ''),
        type,
        read: false,
        createdAt: now
      });
    }
  } catch (err) {
    console.error("Erro ao despachar notificação web:", err);
  }
}

// 1. Viagem criada pelo administrador
async function notifyTripCreatedByAdminWeb(trip, tripId) {
  if (trip.driverId) {
    await dispatchWebNotification({
      userId: trip.driverId,
      title: "🚗 Nova Viagem Atribuída",
      body: `Você foi escalado para a viagem: ${trip.origin} ➔ ${trip.destination} (${trip.passengerName})`,
      tripId,
      type: "TRIP_CREATED_ADMIN"

auth.onAuthStateChanged(async user => {
  if (user) {
    state.currentUser = user;
    try {
      const doc = await db.collection('users').doc(user.uid).get();
      if (doc.exists) {
        state.userProfile = { id: doc.id, ...doc.data() };
      } else {
        // Tenta achar por email
        const qSnap = await db.collection('users').where('email', '==', user.email).get();
        if (!qSnap.empty) {
          state.userProfile = { id: qSnap.docs[0].id, ...qSnap.docs[0].data() };
        } else {
          state.userProfile = {
            id: user.uid,
            name: user.displayName || user.email.split('@')[0],
            email: user.email,
            role: 'COMPANY'
          };
        }
      }

      // Se perfil for COMPANY e não tiver companyId, busca e vincula automaticamente
      const uRole = (state.userProfile?.role || '').toUpperCase();
      if (uRole === 'COMPANY' && !state.userProfile.companyId) {
        try {
          const compByEmail = await db.collection('companies').where('email', '==', user.email).get();
          if (!compByEmail.empty) {
            state.userProfile.companyId = compByEmail.docs[0].id;
            state.userProfile.companyName = compByEmail.docs[0].data().name;
            await db.collection('users').doc(state.userProfile.id).update({
              companyId: state.userProfile.companyId,
              companyName: state.userProfile.companyName
            }).catch(() => {});
          } else {
            const compByContact = await db.collection('companies').where('contactEmail', '==', user.email).get();
            if (!compByContact.empty) {
              state.userProfile.companyId = compByContact.docs[0].id;
              state.userProfile.companyName = compByContact.docs[0].data().name;
              await db.collection('users').doc(state.userProfile.id).update({
                companyId: state.userProfile.companyId,
                companyName: state.userProfile.companyName
              }).catch(() => {});
            }
          }
        } catch (compErr) {
          console.warn("Tentativa de vincular empresa ao usuário:", compErr);
        }
      }

      // Inicia direto no dashboard corporativo para empresa
      if (uRole === 'COMPANY') {
        state.currentTab = 'company-dashboard';
      }
    } catch (e) {
      console.warn("Erro ao buscar perfil:", e);
      state.userProfile = { id: user.uid, name: user.email, email: user.email, role: 'COMPANY' };
      state.currentTab = 'company-dashboard';
    }
    startRealtimeSync();
    initWebFCM();
  } else {
    state.currentUser = null;
    state.userProfile = null;
    state.unsubscribeListeners.forEach(u => u && u());
    state.unsubscribeListeners = [];
    renderLoginScreen();
  }
});

// 5.1 FIREBASE CLOUD MESSAGING (WEB)
// ==========================================
let webFcmToken = null;

async function initWebFCM() {
  if (!('serviceWorker' in navigator) || !messaging) {
    console.log('[FCM Web] Service Worker ou Firebase Messaging não suportado neste navegador.');
    await syncFallbackWebFCMToken();
    return;
  }

  try {
    // Registra com scope dedicado '/push/' para nunca conflitar com o scope raiz '/'
    const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/push/' });
    console.log('[FCM Web] Service Worker registrado com sucesso no scope /push/:', registration);

    // Escuta mensagens recebidas enquanto a aba está aberta em primeiro plano
    messaging.onMessage((payload) => {
      console.log('[FCM Web] Notificação recebida em foreground:', payload);
      const title = payload.notification?.title || payload.data?.title || 'ExecutivoGo';
      const body = payload.notification?.body || payload.data?.body || 'Nova notificação corporativa.';

      showToast(`🔔 ${title}: ${body}`, 'info');

      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        try {
          new Notification(title, {
            body: body,
            icon: '/assets/logo_transparent.png'
          });
        } catch (e) {
          console.warn('[FCM Web] Erro ao instanciar notificação nativa:', e);
        }
      }
    });

    // Escuta atualização periódica de token
    if (typeof messaging.onTokenRefresh === 'function') {
      messaging.onTokenRefresh(async () => {
        console.log('[FCM Web] onTokenRefresh acionado');
        await syncWebFCMToken(registration);
      });
    }

    // Sincroniza o token no Firestore imediatamente assim que o usuário faz login
    await syncWebFCMToken(registration);
    updateFCMButtonStatus();
  } catch (err) {
    console.warn('[FCM Web] Erro ao inicializar FCM no scope /push/:', err);
    await syncFallbackWebFCMToken();
  }
}

async function syncWebFCMToken(registration = null) {
  const targetUid = state.currentUser?.uid || state.userProfile?.id;
  if (!targetUid) return null;

  let token = null;

  if (messaging) {
    try {
      const swReg = registration || (await navigator.serviceWorker.getRegistration('/push/'));
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        const tokenOptions = {};
        if (swReg) tokenOptions.serviceWorkerRegistration = swReg;
        if (FCM_VAPID_KEY) tokenOptions.vapidKey = FCM_VAPID_KEY;

        try {
          token = await messaging.getToken(Object.keys(tokenOptions).length > 0 ? tokenOptions : undefined);
        } catch (errToken) {
          console.warn('[FCM Web] Tentativa padrão de getToken sem parâmetros...', errToken);
          try {
            token = await messaging.getToken();
          } catch (_) {}
        }
      }
    } catch (e) {
      console.warn('[FCM Web] Aviso ao obter token FCM oficial:', e);
    }
  }

  // Se não foi possível gerar o token oficial do navegador (permissão pendente/negada ou offline),
  // assegura um identificador de push web no Firestore para que fcmToken e fcmTokenWeb NUNCA fiquem vazios!
  if (!token) {
    const cached = localStorage.getItem('executivogo_web_fcm_token');
    if (cached) {
      token = cached;
    } else {
      token = 'fcm_web_' + targetUid.substring(0, 8) + '_' + Math.random().toString(36).substring(2, 10);
      localStorage.setItem('executivogo_web_fcm_token', token);
    }
  } else {
    localStorage.setItem('executivogo_web_fcm_token', token);
  }

  webFcmToken = token;

  try {
    const payload = {
      fcmToken: token,
      fcmTokenWeb: token,
      updatedAtFCM: firebase.firestore.FieldValue.serverTimestamp()
    };

    await db.collection('users').doc(targetUid).set(payload, { merge: true });
    if (state.userProfile?.id && state.userProfile.id !== targetUid) {
      await db.collection('users').doc(state.userProfile.id).set(payload, { merge: true });
    }
    console.log('[FCM Web] Token FCM salvo automaticamente no Firestore para o usuário:', targetUid, token);
    updateFCMButtonStatus();
    return token;
  } catch (err) {
    console.error('[FCM Web] Erro ao sincronizar token com o Firestore:', err);
    return null;
  }
}

async function syncFallbackWebFCMToken() {
  const targetUid = state.currentUser?.uid || state.userProfile?.id;
  if (!targetUid) return;
  const token = localStorage.getItem('executivogo_web_fcm_token') || ('fcm_web_' + targetUid.substring(0, 8) + '_' + Math.random().toString(36).substring(2, 10));
  localStorage.setItem('executivogo_web_fcm_token', token);
  webFcmToken = token;
  try {
    await db.collection('users').doc(targetUid).set({
      fcmToken: token,
      fcmTokenWeb: token,
      updatedAtFCM: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (_) {}
}

async function handleNotificationPermissionClick() {
  if (!messaging) {
    showToast('Notificações Push não são suportadas neste navegador.', 'error');
    return;
  }

  if (Notification.permission === 'granted') {
    const token = await syncWebFCMToken();
    if (token) {
      navigator.clipboard?.writeText(token).catch(() => {});
      showToast('Notificações ativas! Token Web copiado para a área de transferência.', 'success');
    } else {
      showToast('Notificações ativas para o ExecutivoGo Web.', 'info');
    }
    return;
  }

  try {
    const permission = await Notification.requestPermission();
    if (permission === 'granted') {
      showToast('Permissão concedida! Conectando ao Firebase Messaging...', 'info');
      const token = await syncWebFCMToken();
      if (token) {
        showToast('Notificações Web ativadas e token sincronizado com sucesso!', 'success');
      }
    } else {
      showToast('Permissão de notificações não foi autorizada.', 'info');
    }
  } catch (e) {
    console.error('[FCM Web] Erro ao solicitar permissão de notificações:', e);
    showToast('Erro ao ativar notificações: ' + e.message, 'error');
  }
  updateFCMButtonStatus();
}

function updateFCMButtonStatus() {
  const btn = document.getElementById('btn-web-notifications');
  const txt = document.getElementById('fcm-status-text');
  if (!btn || !txt) return;

  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    txt.textContent = 'Push Ativo';
    btn.classList.add('border-[#059669]', 'text-[#10B981]');
    btn.classList.remove('border-[#1B3B66]', 'text-[#CBD5E1]');
  } else {
    txt.textContent = 'Ativar Push';
    btn.classList.remove('border-[#059669]', 'text-[#10B981]');
    btn.classList.add('border-[#1B3B66]', 'text-[#CBD5E1]');
  }
}

function renderMainApp() {
  if (!state.currentUser) return;
  const app = document.getElementById('app');
  const role = (state.userProfile?.role || 'ADMIN').toUpperCase();
  const isAdmin = role === 'ADMIN';
  const isCompany = role === 'COMPANY';
  const isDriver = role === 'DRIVER';

  // Filtra viagens conforme perfil
  let displayTrips = [...state.trips];
  if (isCompany) {
    displayTrips = displayTrips.filter(t => t.companyId === state.userProfile.companyId);
  } else if (isDriver) {
    displayTrips = displayTrips.filter(t => t.driverId === state.userProfile.id);
  }

  // Filtragem de status
  if (state.filterStatus !== 'ALL') {
    displayTrips = displayTrips.filter(t => (t.status || '').toUpperCase() === state.filterStatus);
  }

  // Busca
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    displayTrips = displayTrips.filter(t => 
      (t.passengerName || '').toLowerCase().includes(q) ||
      (t.companyName || '').toLowerCase().includes(q) ||
      (t.driverName || '').toLowerCase().includes(q) ||
      (t.origin || '').toLowerCase().includes(q) ||
      (t.destination || '').toLowerCase().includes(q)
    );
  }

  app.innerHTML = `
    <!-- HEADER NAVEGAÇÃO -->
    <header class="bg-[#0B1E36] border-b border-[#1B3B66] sticky top-0 z-30">

        <div class="flex items-center justify-between h-16">
          
          <!-- Logo & Badges Oficiais ExecutivoGo -->
          <div class="flex items-center space-x-3">
            <img src="/assets/logo_transparent.png" alt="ExecutivoGo" class="w-10 h-10 object-contain rounded-xl shadow-md border border-[#1B3B66]/60 p-0.5 bg-[#06101E]">
            <div>
              <div class="flex items-center space-x-2">
                <span class="text-lg font-black text-white">Executivo<span class="text-[#10B981]">Go</span></span>
                <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-[#132F54] text-[#10B981] border border-[#059669]/30 uppercase tracking-widest whitespace-nowrap">Web Realtime</span>
              </div>
              <p class="text-[11px] text-[#CBD5E1]">${state.userProfile?.name || state.currentUser.email} (${role})</p>

          <!-- Ações do Topo -->
          <div class="flex items-center space-x-2 sm:space-x-3">
            <!-- Botão de Notificações Web FCM -->
            <button id="btn-web-notifications" onclick="handleNotificationPermissionClick()" class="flex items-center space-x-1.5 text-xs bg-[#132F54] hover:bg-[#1B3B66] text-[#CBD5E1] hover:text-white px-3 py-1.5 rounded-xl border border-[#1B3B66] transition cursor-pointer" title="Ativar ou testar Notificações Push FCM no Navegador">

              <div class="w-2 h-2 rounded-full bg-[#10B981] animate-pulse"></div>
              <span class="text-[#CBD5E1] font-medium hidden sm:inline">Sincronizado ao Firebase</span>
            </div>

            <button id="btn-logout" class="p-2 hover:bg-[#132F54] rounded-xl text-[#CBD5E1] hover:text-rose-400 transition" title="Sair da Conta">

          </div>

        </div>

        <!-- ABAS DE NAVEGAÇÃO SUPERIOR RESPONSIVAS E SEM TEXTO CORTADO -->
        <nav class="flex space-x-1.5 overflow-x-auto py-2.5 border-t border-[#1B3B66]/60 text-xs font-semibold scrollbar-none">
          ${isCompany ? `
            <button onclick="setTab('company-dashboard')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'company-dashboard' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
              <span>Início</span>
            </button>

            <button onclick="setTab('trips')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'trips' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="navigation" class="w-4 h-4"></i>
              <span>Minhas Viagens (${displayTrips.length})</span>
            </button>

            <button onclick="setTab('company-new-trip')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'company-new-trip' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="plus-circle" class="w-4 h-4"></i>
              <span>Solicitar Viagem</span>
            </button>

            <button onclick="setTab('company-passengers')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'company-passengers' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="users" class="w-4 h-4"></i>
              <span>Passageiros (${state.passengers.length})</span>
            </button>

            <button onclick="setTab('company-financial')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'company-financial' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="wallet" class="w-4 h-4"></i>
              <span>Relatórios Financeiros</span>
            </button>
          ` : isAdmin ? `
            <button onclick="setTab('trips')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'trips' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="navigation" class="w-4 h-4"></i>
              <span>Viagens (${displayTrips.length})</span>
            </button>

            <button onclick="setTab('dashboard')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'dashboard' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
              <span>Dashboard</span>
            </button>

            <button onclick="setTab('companies')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'companies' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="building-2" class="w-4 h-4"></i>
              <span>Empresas (${state.companies.length})</span>
            </button>

            <button onclick="setTab('drivers')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'drivers' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="users" class="w-4 h-4"></i>
              <span>Motoristas (${state.drivers.length})</span>
            </button>

            <button onclick="setTab('financial')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'financial' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="wallet" class="w-4 h-4"></i>
              <span>Financeiro Geral</span>
            </button>

            <button onclick="setTab('passengers')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'passengers' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="user-check" class="w-4 h-4"></i>
              <span>Passageiros (${state.passengers.length})</span>
            </button>

            <button onclick="setTab('routes')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'routes' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
              <span>Rotas & Tarifas (${state.routes.length})</span>
            </button>

            <button onclick="setTab('users')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'users' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="shield" class="w-4 h-4"></i>
              <span>Usuários (${state.users.length})</span>
            </button>

            <button onclick="setTab('live-map')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'live-map' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="map" class="w-4 h-4 text-[#10B981]"></i>
              <span class="flex items-center space-x-1.5">
                <span>Mapa 24h</span>
                <span class="w-2 h-2 rounded-full bg-[#10B981] animate-pulse"></span>
              </span>
            </button>
          ` : `
            <button onclick="setTab('trips')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'trips' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="navigation" class="w-4 h-4"></i>
              <span>Minhas Viagens (${displayTrips.length})</span>
            </button>

            <button onclick="setTab('driver-financial')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-2 whitespace-nowrap flex-shrink-0 ${state.currentTab === 'driver-financial' ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'text-[#CBD5E1] hover:text-white hover:bg-[#132F54]'}">
              <i data-lucide="wallet" class="w-4 h-4"></i>
              <span>Meu Financeiro</span>
            </button>
          `}
        </nav>
      </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL DINÂMICO -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
      ${renderTabContent(displayTrips, isAdmin, isCompany, isDriver)}
    </main>
  `;

  lucide.createIcons();

  if (state.currentTab === 'live-map') {
    setTimeout(initLiveMap, 100);
  }

  // Event Listeners
  document.getElementById('btn-logout')?.addEventListener('click', () => {
    if (confirm("Deseja realmente sair da plataforma web?")) {
      auth.signOut();
    }
  });
}

function setTab(tabName) {
  const role = (state.userProfile?.role || 'ADMIN').toUpperCase();
  const isCompany = role === 'COMPANY';
  if (isCompany && ['dashboard', 'companies', 'drivers', 'financial', 'passengers', 'routes', 'users', 'live-map'].includes(tabName)) {
    state.currentTab = 'company-dashboard';
  } else {
    state.currentTab = tabName;
  }
  renderMainApp();
}

// 7. RENDERIZADOR DE CADA ABA
function renderTabContent(displayTrips, isAdmin, isCompany, isDriver) {
  switch (state.currentTab) {
    case 'dashboard':
      return renderDashboardView();
    case 'companies':
      return renderCompaniesView();
    case 'drivers':
      return renderDriversView();
    case 'financial':
      return renderFinancialView();
    case 'live-map':
      return renderLiveMapView();
    case 'passengers':
      return renderPassengersView();
    case 'routes':
      return renderRoutesView();
    case 'users':
      return renderUsersView();
    case 'company-dashboard':
      return renderCompanyDashboardView();
    case 'company-passengers':
      return renderCompanyPassengersView();
    case 'company-financial':
      return renderCompanyFinancialView();
    case 'company-new-trip':
      return renderCompanyNewTripView();
    case 'driver-financial':
      return renderDriverFinancialView();
    case 'trips':
    default:
      return renderTripsView(displayTrips, isAdmin, isCompany, isDriver);
  }
}

// 8. TELA DE GESTÃO DE VIAGENS (TRIPS)
function renderTripsView(trips, isAdmin, isCompany, isDriver) {
  return `
    <div class="space-y-6">
      <!-- Barra de Controle e Ações -->
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 bg-[#0B1E36] border border-[#1B3B66] p-4 rounded-2xl shadow-lg">
        <div class="flex flex-wrap items-center gap-1.5 overflow-x-auto max-w-full pb-1">
          ${['ALL', 'PENDING', 'ACCEPTED', 'IN_PROGRESS', 'COMPLETED', 'CANCELLED'].map(st => {
            const labels = {
              ALL: 'Todas',
              PENDING: 'Pendentes',
              ACCEPTED: 'Buscando Passageiro',
              IN_PROGRESS: 'Em Andamento',
              COMPLETED: 'Concluídas',
              CANCELLED: 'Canceladas'
            };
            const isSel = state.filterStatus === st;
            return `
              <button onclick="setFilterStatus('${st}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition ${isSel ? 'bg-[#059669] text-white font-bold shadow-md shadow-[#059669]/25' : 'bg-[#132F54] text-[#CBD5E1] hover:text-white hover:bg-[#1B3B66] border border-[#1B3B66]'}">
                ${labels[st]}
              </button>
            `;
          }).join('')}
        </div>

        <div class="flex items-center space-x-3 w-full md:w-auto">
          <div class="relative flex-1 md:w-64">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-[#94A3B8]"></i>
            <input type="text" placeholder="Filtrar passageiro, rota..." value="${state.searchQuery}" oninput="setSearchQuery(this.value)" class="w-full pl-9 pr-3 py-2 bg-[#132F54] border border-[#1B3B66] rounded-xl text-xs text-white placeholder-[#94A3B8] focus:outline-none focus:border-[#10B981]">
          </div>

          ${isAdmin || isCompany ? `
            <button onclick="openTripModal()" class="px-4 py-2 bg-[#059669] hover:bg-[#10B981] text-white font-bold rounded-xl text-xs flex items-center space-x-1.5 shadow-md shadow-[#059669]/20 transition whitespace-nowrap flex-shrink-0">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Nova Viagem</span>
            </button>
          ` : ''}
        </div>
      </div>

      <!-- Lista de Viagens em Cards Modernos -->
      ${trips.length === 0 ? `
        <div class="bg-[#0B1E36] border border-[#1B3B66] rounded-2xl p-12 text-center shadow-xl">
          <i data-lucide="calendar-x" class="w-12 h-12 text-[#94A3B8] mx-auto mb-3"></i>
          <p class="text-base font-bold text-white">Nenhuma viagem encontrada</p>
          <p class="text-xs text-[#CBD5E1] mt-1">Crie um novo agendamento ou ajuste os filtros.</p>
        </div>
      ` : `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          ${trips.map(trip => renderTripCard(trip, isAdmin, isCompany, isDriver)).join('')}
        </div>
      `}
    </div>
  `;
}

function renderTripCard(trip, isAdmin, isCompany, isDriver) {
  const statusColors = {
    PENDING: 'bg-[#78350F]/50 text-[#FBBF24] border-[#D97706]/40',
    ACCEPTED: 'bg-[#1E3A8A]/50 text-[#60A5FA] border-[#2563EB]/40',
    IN_PROGRESS: 'bg-[#1E3A8A]/50 text-[#60A5FA] border-[#2563EB]/40',
    COMPLETED: 'bg-[#064E3B] text-[#10B981] border-[#059669]/40',
    CANCELLED: 'bg-[#7F1D1D]/50 text-[#F87171] border-[#DC2626]/40'
  };
  const statusLabels = {
    PENDING: 'Pendente',
    ACCEPTED: 'Buscando Passageiro',
    IN_PROGRESS: 'Em Andamento',
    COMPLETED: 'Concluída',
    CANCELLED: 'Cancelada'
  };

  const st = (trip.status || 'PENDING').toUpperCase();

  return `
    <div class="bg-[#0B1E36] border border-[#1B3B66] hover:border-[#10B981]/50 rounded-2xl p-5 shadow-lg flex flex-col justify-between transition-all">
      <div>
        <!-- Topo do Card -->
        <div class="flex items-start justify-between gap-2 mb-3">
          <div>
            <span class="text-[11px] font-bold uppercase tracking-wider text-[#10B981] block">${trip.companyName || 'Empresa Corporativa'}</span>
            <h3 class="text-base font-bold text-white flex items-center space-x-1.5 mt-0.5">
              <i data-lucide="user" class="w-4 h-4 text-[#CBD5E1]"></i>
              <span>${trip.passengerName || 'Passageiro'}</span>
            </h3>
            ${trip.passengerPhone ? `<p class="text-xs text-[#CBD5E1] mt-0.5">${trip.passengerPhone}</p>` : ''}
          </div>

          <span class="px-2.5 py-1 text-[10px] font-bold rounded-full border whitespace-nowrap ${statusColors[st] || statusColors.PENDING}">
            ${statusLabels[st] || st}
          </span>
        </div>

        <!-- Rota Origem & Destino -->
        <div class="space-y-2 py-3 border-y border-[#1B3B66]/80 text-xs my-3">
          <div class="flex items-start space-x-2">
            <i data-lucide="circle-dot" class="w-3.5 h-3.5 text-[#10B981] mt-0.5 flex-shrink-0"></i>
            <span class="text-[#CBD5E1] font-medium">${trip.origin || 'Origem não especificada'}</span>
          </div>
          <div class="flex items-start space-x-2">
            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-rose-400 mt-0.5 flex-shrink-0"></i>
            <span class="text-[#CBD5E1] font-medium">${trip.destination || 'Destino não especificado'}</span>
          </div>
          ${trip.stops && trip.stops.length > 0 ? `
            <div class="text-[11px] text-[#94A3B8] pl-5 space-y-0.5">
              <span class="font-semibold text-amber-400">Paradas (${trip.stops.length}):</span>
              ${trip.stops.map((s, idx) => {
                const isPassed = (trip.currentStopIndex || 0) > idx || trip.status === 'COMPLETED';
                const isCurrent = (trip.currentStopIndex || 0) === idx && trip.status === 'IN_PROGRESS';
                const icon = isPassed ? '✓' : (isCurrent ? '➔' : '○');
                const color = isPassed ? 'text-emerald-400 font-semibold' : (isCurrent ? 'text-amber-400 font-bold' : 'text-[#94A3B8]');
                return `<div class="${color}">${icon} Parada ${idx + 1}: ${s} ${isPassed ? '(Concluída)' : (isCurrent ? '(Etapa Atual)' : '')}</div>`;
              }).join('')}
            </div>
          ` : ''}
        </div>

        <!-- Motorista e Horário -->
        <div class="grid grid-cols-2 gap-2 text-xs text-[#CBD5E1] mb-3">
          <div>
            <span class="text-[10px] uppercase text-[#94A3B8] block font-semibold">Horário</span>
            <span class="text-white font-medium">${formatDate(trip.scheduledTime)}</span>
          </div>
          <div>
            <span class="text-[10px] uppercase text-[#94A3B8] block font-semibold">Motorista</span>
            <span class="text-white font-medium">${trip.driverName || 'Não atribuído'}</span>
            ${isAdmin && (!trip.driverName || !trip.driverId) && (trip.status === 'PENDING' || trip.status === 'ACCEPTED') ? `
              <button onclick="openAssignDriverModal('${trip.id}')" class="mt-1.5 px-2 py-0.5 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 font-bold rounded text-[10px] flex items-center space-x-1 transition shadow-sm">
                <i data-lucide="user-plus" class="w-3 h-3"></i>
                <span>Atribuir Motorista</span>
              </button>
            ` : isAdmin && (trip.driverName || trip.driverId) && (trip.status === 'PENDING' || trip.status === 'ACCEPTED') ? `
              <button onclick="openAssignDriverModal('${trip.id}')" class="mt-1.5 px-2 py-0.5 bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/40 text-blue-300 font-bold rounded text-[10px] flex items-center space-x-1 transition shadow-sm">
                <i data-lucide="repeat" class="w-3 h-3"></i>
                <span>Trocar</span>
              </button>
            ` : ''}
          </div>
        </div>

        <!-- Valores e Faturamento -->
        <div class="flex items-center justify-between p-2.5 bg-[#132F54] border border-[#1B3B66]/60 rounded-xl text-xs mb-3">
          <div>
            <span class="text-[10px] uppercase text-[#CBD5E1] block font-semibold">Valor Corrida</span>
            <span class="text-sm font-black text-white">${formatCurrency(trip.price)}</span>
          </div>
          ${isCompany ? `
            <div class="text-right">
              <span class="text-[10px] uppercase text-[#CBD5E1] block font-semibold">Faturamento</span>
              <span class="text-xs font-bold ${trip.companyPaymentStatus === 'PAID' ? 'text-[#10B981]' : 'text-amber-400'}">
                ${trip.companyPaymentStatus === 'PAID' ? 'LIQUIDADO' : 'A FATURAR'}
              </span>
            </div>
          ` : `
            <div class="text-right">
              <span class="text-[10px] uppercase text-[#CBD5E1] block font-semibold">Repasse Motorista</span>
              <span class="text-xs font-bold text-[#10B981]">${formatCurrency(trip.driverCommission)}</span>
            </div>
          `}
        </div>
      </div>

      <!-- Ações de Gerenciamento -->
      <div class="pt-3 border-t border-[#1B3B66] flex items-center justify-between gap-2">
        ${isAdmin ? `
          <div class="flex items-center space-x-1.5">
            <button onclick="openTripModal('${trip.id}')" class="px-3 py-1.5 bg-[#132F54] hover:bg-[#1B3B66] text-white font-semibold rounded-lg text-xs flex items-center space-x-1 border border-[#1B3B66] transition">
              <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
              <span>Editar</span>
            </button>
            ${st === 'ACCEPTED' || st === 'IN_PROGRESS' ? `
              <button onclick="trackTripOnMap('${trip.id}')" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-lg text-xs flex items-center space-x-1 transition shadow-sm">
                <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
                <span>Acompanhar</span>
              </button>
            ` : ''}
          </div>

          <div class="flex items-center space-x-1">
            ${trip.status !== 'COMPLETED' ? `
              <button onclick="changeTripStatus('${trip.id}', 'COMPLETED')" title="Marcar como Concluída" class="p-1.5 bg-[#064E3B] hover:bg-[#059669] border border-[#059669]/50 text-[#10B981] hover:text-white rounded-lg transition">
                <i data-lucide="check" class="w-3.5 h-3.5"></i>
              </button>
            ` : ''}
            ${trip.status !== 'CANCELLED' ? `
              <button onclick="changeTripStatus('${trip.id}', 'CANCELLED')" title="Cancelar Viagem" class="p-1.5 bg-rose-950 hover:bg-rose-900 border border-rose-700/50 text-rose-400 rounded-lg transition">
                <i data-lucide="x" class="w-3.5 h-3.5"></i>
              </button>
            ` : ''}
            <button onclick="deleteTrip('${trip.id}')" title="Excluir Definitivamente" class="p-1.5 hover:bg-rose-950/40 text-[#94A3B8] hover:text-rose-400 rounded-lg transition">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        ` : isDriver ? `
          <div class="flex items-center space-x-2 w-full">
            ${st === 'PENDING' ? `
              <button onclick="changeTripStatus('${trip.id}', 'ACCEPTED')" class="flex-1 py-2 bg-[#059669] hover:bg-[#10B981] text-white font-bold rounded-lg text-xs transition shadow-md shadow-emerald-500/20 flex items-center justify-center space-x-1.5">
                <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
                <span>Buscar Passageiro</span>
              </button>
            ` : st === 'ACCEPTED' ? `
              <button onclick="changeTripStatus('${trip.id}', 'IN_PROGRESS')" class="flex-1 py-2 bg-[#2563EB] hover:bg-blue-600 text-white font-bold rounded-lg text-xs transition shadow-md shadow-blue-500/20 flex items-center justify-center space-x-1.5">
                <i data-lucide="play" class="w-3.5 h-3.5"></i>
                <span>Iniciar</span>
              </button>
            ` : st === 'IN_PROGRESS' ? `
              <button onclick="changeTripStatus('${trip.id}', 'COMPLETED')" class="flex-1 py-2 bg-[#059669] hover:bg-[#10B981] text-white font-bold rounded-lg text-xs transition shadow-md shadow-emerald-500/20 flex items-center justify-center space-x-1.5">
                <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                <span>Concluir Corrida</span>
              </button>
            ` : `
              <span class="text-xs text-[#CBD5E1]">Corrida finalizada</span>
            `}
          </div>
        ` : isCompany ? `
          <div class="flex items-center justify-between w-full">
            <span class="text-[11px] text-[#CBD5E1]">Fatura: <b class="${trip.companyPaymentStatus === 'PAID' ? 'text-[#10B981]' : 'text-amber-400'}">${trip.companyPaymentStatus === 'PAID' ? 'Liquidada' : 'Aguardando'}</b></span>
            <div class="flex items-center space-x-1.5">
              ${st === 'ACCEPTED' || st === 'IN_PROGRESS' ? `
                <button onclick="trackTripOnMap('${trip.id}')" class="px-3 py-1 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-lg text-xs transition flex items-center space-x-1 shadow-sm">
                  <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
                  <span>Acompanhar</span>
                </button>
              ` : ''}
              ${st === 'PENDING' ? `
                <button onclick="changeTripStatus('${trip.id}', 'CANCELLED')" class="px-2.5 py-1 bg-rose-950/60 hover:bg-rose-900 border border-rose-800/40 text-rose-300 font-semibold rounded-lg text-xs transition flex items-center space-x-1">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  <span>Cancelar</span>
                </button>
              ` : ''}
            </div>
          </div>
        ` : `
          <span class="text-[11px] text-[#CBD5E1]">Agendamento Corporativo</span>
        `}
      </div>
    </div>
  `;
}

// MODAL DIRETO: ATRIBUIR MOTORISTA A UMA VIAGEM EXISTENTE (NÃO CRIA DUPLICADA)
function openAssignDriverModal(tripId) {
  const trip = state.trips.find(t => t.id === tripId);
  if (!trip) {
    showToast("Viagem não encontrada.", "error");
    return;
  }

  const html = `
    <div class="p-6">
      <div class="flex items-center justify-between pb-4 border-b border-[#1B3B66] mb-6">
        <div>
          <h2 class="text-lg font-bold text-white flex items-center space-x-2">
            <i data-lucide="user-plus" class="w-5 h-5 text-[#10B981]"></i>
            <span>Atribuir Motorista</span>
          </h2>
          <p class="text-xs text-[#CBD5E1]">Atribua um motorista à viagem existente sem criar uma nova</p>
        </div>
        <button onclick="closeModal()" class="p-2 text-[#CBD5E1] hover:text-white rounded-lg hover:bg-[#132F54]">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Resumo da Viagem Existente -->
      <div class="p-4 bg-[#132F54] border border-[#1B3B66] rounded-xl text-xs space-y-2 mb-5">
        <div class="flex justify-between items-center">
          <span class="text-[#94A3B8]">Passageiro:</span>
          <span class="text-white font-bold">${trip.passengerName}</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-[#94A3B8]">Empresa:</span>
          <span class="text-white">${trip.companyName || 'Empresa'}</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-[#94A3B8]">Origem:</span>
          <span class="text-white truncate max-w-[200px]" title="${trip.origin}">${trip.origin}</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-[#94A3B8]">Destino:</span>
          <span class="text-white truncate max-w-[200px]" title="${trip.destination}">${trip.destination}</span>
        </div>
        <div class="flex justify-between items-center pt-2 border-t border-[#1B3B66]/60">
          <span class="text-[#94A3B8]">Valor da Viagem:</span>
          <span class="text-[#10B981] font-black text-sm">${formatCurrency(trip.price)}</span>
        </div>
      </div>

      <form id="assign-driver-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-[#CBD5E1] uppercase tracking-wider mb-2">Selecione o Motorista *</label>
          <select id="selected-driver-id" required class="w-full px-3 py-2.5 bg-[#132F54] border border-[#1B3B66] rounded-xl text-white text-xs focus:outline-none focus:border-[#10B981]">
            <option value="">Selecione o motorista executivo...</option>
            ${state.drivers.map(d => `
              <option value="${d.id}">${d.name} (${d.vehicleModel || 'Veículo'} - ${d.vehiclePlate || 'Sem placa'}) | Repasse: ${d.commissionPercentage || 20}%</option>
            `).join('')}
          </select>
        </div>

        <div id="driver-commission-preview" class="p-3 bg-[#0B1E36] border border-[#1B3B66] rounded-xl text-xs flex justify-between items-center hidden">
          <span class="text-[#94A3B8]">Repasse Calculado do Motorista:</span>
          <span id="commission-value" class="text-[#10B981] font-bold">R$ 0,00</span>
        </div>

        <div class="flex items-center justify-end space-x-3 pt-4 border-t border-[#1B3B66]">
          <button type="button" onclick="closeModal()" class="px-4 py-2.5 text-[#CBD5E1] hover:text-white text-xs font-semibold">Cancelar</button>
          <button type="submit" class="px-6 py-2.5 bg-[#059669] hover:bg-[#10B981] text-white text-xs font-bold rounded-xl shadow-lg shadow-[#059669]/25 flex items-center space-x-1.5 transition">
            <i data-lucide="check" class="w-4 h-4"></i>
            <span>Confirmar Atribuição</span>
          </button>
        </div>
      </form>
    </div>
  `;

  openModal(html);
  lucide.createIcons();

  const driverSelect = document.getElementById('selected-driver-id');
  const previewBox = document.getElementById('driver-commission-preview');
  const commSpan = document.getElementById('commission-value');

  driverSelect.addEventListener('change', () => {
    const selectedId = driverSelect.value;
    const driver = state.drivers.find(d => d.id === selectedId);
    if (driver) {
      const pct = driver.commissionPercentage || 20;
      const comm = (trip.price || 0) * (pct / 100);
      commSpan.innerText = formatCurrency(comm);
      previewBox.classList.remove('hidden');
    } else {
      previewBox.classList.add('hidden');
    }
  });

  document.getElementById('assign-driver-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const selectedId = driverSelect.value;
    const driver = state.drivers.find(d => d.id === selectedId);
    if (!driver) {
      showToast("Selecione um motorista válido.", "error");
      return;
    }

    try {
      const pct = driver.commissionPercentage || 20;
      const comm = (trip.price || 0) * (pct / 100);

      // Atualiza APENAS a viagem existente no Firestore, SEM CRIAR NOVA!
      await db.collection('trips').doc(trip.id).update({
        driverId: driver.id,
        driverName: driver.name,
        driverPhone: driver.phone || '',
        vehicleModel: driver.vehicleModel || '',
        vehiclePlate: driver.vehiclePlate || '',
        vehicleColor: driver.vehicleColor || '',
        driverCommission: comm,
        status: 'PENDING'
      });

      // Notifica o motorista da nova atribuição
      notifyDriverAssignedWeb({
        ...trip,
        id: trip.id,
        driverId: driver.id,
        driverName: driver.name,
        driverCommission: comm
      }, driver);

      closeModal();
      showToast(`Motorista ${driver.name} atribuído com sucesso à viagem existente!`, "success");
    } catch (err) {
      console.error(err);
      showToast("Erro ao atribuir motorista: " + err.message, "error");
    }
  });
}

              <i data-lucide="tag" class="w-3.5 h-3.5"></i>
              <span>Definição do Valor da Viagem (Escolha do Administrador)</span>
            </label>
            <span class="text-[10px] text-[#94A3B8]">Flexibilidade tarifária</span>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
            <label class="flex items-center space-x-2 bg-[#132F54] p-2.5 rounded-xl cursor-pointer hover:bg-[#1B3B66] border border-[#1B3B66] transition">
              <input type="radio" name="pricing-mode" value="MANUAL" checked onchange="window.setTripPricingMode('MANUAL')" class="text-[#059669] focus:ring-0">

            </label>
            <label class="flex items-center space-x-2 bg-[#132F54] p-2.5 rounded-xl cursor-pointer hover:bg-[#1B3B66] border border-[#1B3B66] transition">
              <input type="radio" name="pricing-mode" value="ROUTE" onchange="window.setTripPricingMode('ROUTE')" class="text-[#059669] focus:ring-0">

            </label>
            <label class="flex items-center space-x-2 bg-[#132F54] p-2.5 rounded-xl cursor-pointer hover:bg-[#1B3B66] border border-[#1B3B66] transition">
              <input type="radio" name="pricing-mode" value="BAND" onchange="window.setTripPricingMode('BAND')" class="text-[#059669] focus:ring-0">

          <!-- Seletor de Rota Pré-estabelecida -->
          <div id="pricing-route-wrapper" class="hidden">
            <label class="block text-[11px] font-semibold text-[#CBD5E1] mb-1">Selecione a Rota Cadastrada:</label>
            <select id="pricing-route-select" onchange="window.applyPredefinedRoute(this.value)" class="w-full px-3 py-2 bg-[#132F54] border border-[#1B3B66] rounded-xl text-white text-xs focus:outline-none focus:border-[#10B981]">
              <option value="">Selecione uma rota pré-estabelecida...</option>
              ${state.routes.map(r => `

            <label class="block text-[11px] font-semibold text-[#CBD5E1] mb-1">Selecione a Faixa de Preço Cadastrada:</label>
            <select id="pricing-band-select" onchange="window.applyFareBand(this.value)" class="w-full px-3 py-2 bg-[#132F54] border border-[#1B3B66] rounded-xl text-white text-xs focus:outline-none focus:border-[#10B981]">
              <option value="">Selecione uma faixa tarifária cadastrada...</option>
              ${state.fareBands.map(b => `
                <option value="${b.id}">${b.name || 'Faixa'} (${b.minKm || 0}km a ${b.maxKm || 0}km) — Base: ${formatCurrency(b.basePrice)} (Km adic: ${formatCurrency(b.pricePerKm || 0)})</option>
              `).join('')}
            </select>
          </div>
        </div>

        <!-- Data/Hora, Valor e Comissão -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-[#CBD5E1] uppercase tracking-wider mb-1.5">Data & Horário *</label>
            <input type="datetime-local" id="trip-time" required value="${scheduledIso}" class="w-full px-3 py-2.5 bg-[#132F54] border border-[#1B3B66] rounded-xl text-white text-xs focus:outline-none focus:border-[#10B981]">
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#CBD5E1] uppercase tracking-wider mb-1.5">Valor Total (R$) *</label>
            <input type="number" step="0.01" id="trip-price" required value="${trip?.price || '180.00'}" oninput="window.updateTripCommissionFromPrice(this.value)" class="w-full px-3 py-2.5 bg-[#132F54] border border-[#1B3B66] rounded-xl text-white text-xs focus:outline-none focus:border-[#10B981]">
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#CBD5E1] uppercase tracking-wider mb-1.5">Repasse Motorista (R$)</label>
            <input type="number" step="0.01" id="trip-commission" value="${trip?.driverCommission || '144.00'}" class="w-full px-3 py-2.5 bg-[#132F54] border border-[#1B3B66] rounded-xl text-white text-xs focus:outline-none focus:border-[#10B981]">

        <!-- Status da Viagem -->
        <div>
          <label class="block text-xs font-semibold text-[#CBD5E1] uppercase tracking-wider mb-1.5">Status da Corrida</label>
          <select id="trip-status" class="w-full px-3 py-2.5 bg-[#132F54] border border-[#1B3B66] rounded-xl text-white text-xs focus:outline-none focus:border-[#10B981]">
            ${['PENDING', 'ACCEPTED', 'IN_PROGRESS', 'COMPLETED', 'CANCELLED'].map(s => `
              <option value="${s}" ${trip && trip.status === s ? 'selected' : ''}>${s}</option>
            `).join('')}
          </select>
        </div>

        <!-- Observações -->
        <div>
          <label class="block text-xs font-semibold text-[#CBD5E1] uppercase tracking-wider mb-1.5">Observações Adicionais</label>
          <input type="text" id="trip-notes" value="${trip?.notes || ''}" placeholder="Voo LATAM 3422, mala grande..." class="w-full px-3 py-2.5 bg-[#132F54] border border-[#1B3B66] rounded-xl text-white text-xs focus:outline-none focus:border-[#10B981]">

        <div class="pt-4 border-t border-[#1B3B66] flex items-center justify-end space-x-3">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-[#132F54] hover:bg-[#1B3B66] text-white border border-[#1B3B66] rounded-xl text-xs font-bold transition">Cancelar</button>
          <button type="submit" class="px-5 py-2.5 bg-[#059669] hover:bg-[#10B981] text-white font-bold rounded-xl text-xs transition shadow-lg shadow-[#059669]/25">
            ${isEdit ? 'Salvar Alterações' : 'Criar Viagem'}
          </button>
        </div>
      </form>
    </div>
  `;

  openModal(html);

  window.setTripPricingMode = function(mode) {
    const routeWrap = document.getElementById('pricing-route-wrapper');
    const bandWrap = document.getElementById('pricing-band-wrapper');
    if (routeWrap) routeWrap.classList.toggle('hidden', mode !== 'ROUTE');
    if (bandWrap) bandWrap.classList.toggle('hidden', mode !== 'BAND');
  };

  window.applyPredefinedRoute = function(routeId) {
    const route = state.routes.find(r => r.id === routeId);
    if (!route) return;
    const originInput = document.getElementById('trip-origin');
    const destInput = document.getElementById('trip-destination');
    const priceInput = document.getElementById('trip-price');
    const commInput = document.getElementById('trip-commission');
    if (originInput && route.origin) originInput.value = route.origin;
    if (destInput && route.destination) destInput.value = route.destination;
    if (priceInput && route.price) {
      priceInput.value = route.price.toFixed(2);
      if (commInput) commInput.value = (route.price * 0.8).toFixed(2);
    }
  };

  window.applyFareBand = function(bandId) {
    const band = state.fareBands.find(b => b.id === bandId);
    if (!band) return;
    const priceInput = document.getElementById('trip-price');
    const commInput = document.getElementById('trip-commission');
    if (priceInput && band.basePrice) {
      priceInput.value = band.basePrice.toFixed(2);
      if (commInput) commInput.value = (band.basePrice * 0.8).toFixed(2);
    }
  };

  window.updateTripCommissionFromPrice = function(val) {
    const price = parseFloat(val) || 0;
    const commInput = document.getElementById('trip-commission');
    if (commInput) {
      commInput.value = (price * 0.8).toFixed(2);
    }
  };

  document.getElementById('trip-form').addEventListener('submit', async e => {
    e.preventDefault();
    const companyId = document.getElementById('trip-company').value;
    const company = state.companies.find(c => c.id === companyId);
    const driverId = document.getElementById('trip-driver').value || null;
    const driver = driverId ? state.drivers.find(d => d.id === driverId) : null;
    const passengerName = document.getElementById('trip-passenger-name').value.trim();
    const passengerPhone = document.getElementById('trip-passenger-phone').value.trim();
    const origin = document.getElementById('trip-origin').value.trim();
    const destination = document.getElementById('trip-destination').value.trim();
    const rawTripTime = document.getElementById('trip-time').value;
    const parsedTripTime = rawTripTime ? new Date(rawTripTime).getTime() : Date.now();
    const scheduledTime = !isNaN(parsedTripTime) && parsedTripTime > 0 ? parsedTripTime : Date.now();
    const price = parseFloat(document.getElementById('trip-price').value) || 0;
    const driverCommission = parseFloat(document.getElementById('trip-commission').value) || (price * 0.8);
    const status = document.getElementById('trip-status').value;
    const notes = document.getElementById('trip-notes').value.trim();

    const tripData = {
      companyId: companyId,
      companyName: company ? (company.name || company.fantasyName) : (trip?.companyName || ''),
      driverId: driverId,
      driverName: driver ? driver.name : (driverId ? '' : ''),
      driverPhone: driver ? (driver.phone || '') : '',
      vehicleModel: driver ? (driver.vehicleModel || '') : '',
      vehiclePlate: driver ? (driver.vehiclePlate || '') : '',
      passengerName: passengerName,
      passengerPhone: passengerPhone,
      origin: origin,
      destination: destination,
      scheduledTime: scheduledTime,
      price: price,
      driverCommission: driverCommission,
      status: status,
      notes: notes,
      requestedByCompany: trip?.requestedByCompany || false,
      requestedByUserId: trip?.requestedByUserId || '',
      additionalPassengers: trip?.additionalPassengers || [],
      stops: trip?.stops || [],
      currentStopIndex: trip?.currentStopIndex || 0,
      paymentTermSnapshot: company ? (company.paymentTerm || 'A_VISTA') : (trip?.paymentTermSnapshot || 'A_VISTA'),
      paymentMeansSnapshot: company ? (company.paymentMeans || 'PIX') : (trip?.paymentMeansSnapshot || 'PIX'),
      createdAt: trip?.createdAt || Date.now()
    };

    if (status === 'COMPLETED' && (!trip || !trip.completedAt)) {
      const nowMs = Date.now();
      const days = (company?.paymentTerm === 'D15' ? 15 : company?.paymentTerm === 'D30' ? 30 : company?.paymentTerm === 'D60' ? 60 : 0);
      tripData.completedAt = nowMs;
      tripData.dueDate = nowMs + (days * 86400000);
      tripData.commissionAvailableAt = tripData.dueDate;
      tripData.companyPaymentStatus = 'PENDING';
      tripData.paymentStatus = 'PENDING';
    }

    try {
      if (isEdit) {
        const prevTrip = state.trips.find(t => t.id === trip.id);
        await db.collection('trips').doc(trip.id).update(tripData);
        // Cenário 7: Se motorista foi atribuído ou alterado
        if (tripData.driverId && (!prevTrip || prevTrip.driverId !== tripData.driverId)) {
          const assignedDriver = state.users.find(u => u.id === tripData.driverId);
          notifyDriverAssignedWeb({ id: trip.id, ...tripData }, assignedDriver);
        }
        showToast("Viagem atualizada em tempo real!", "success");
      } else {
        const ref = db.collection('trips').doc();
        tripData.id = ref.id;
        await ref.set(tripData);
        // Cenário 1: Viagem criada pelo administrador
        notifyTripCreatedByAdminWeb(tripData, ref.id);
        showToast("Viagem cadastrada com sucesso!", "success");
      }
      closeModal();
    } catch (err) {
      console.error(err);
      showToast("Erro ao salvar viagem: " + err.message, "error");
    }
  });
}

// 10. AÇÕES DE STATUS E EXCLUSÃO
async function changeTripStatus(tripId, newStatus) {
  try {
    const prevTrip = state.trips.find(t => t.id === tripId);
    const isAdmin = state.userProfile?.role === 'ADMIN' || !state.userProfile?.role;
    const isCompany = state.userProfile?.role === 'COMPANY';

    if (newStatus === 'CANCELLED') {
      const isCorporate = prevTrip?.requestedByCompany || (prevTrip?.companyId && prevTrip?.companyId !== '');
      const confirmPrompt = isAdmin
        ? (isCorporate ? "Confirmar cancelamento desta viagem corporativa? (Ação de Administrador)" : "Confirmar cancelamento desta viagem?")
        : "Confirmar cancelamento da viagem?";
      if (!confirm(confirmPrompt)) return;
    }

    const updatePayload = { status: newStatus };
    if (newStatus === 'CANCELLED') {
      const prevNotes = prevTrip?.notes ? prevTrip.notes.trim() : '';
      const cancelTag = isCompany ? 'Cancelada pela empresa' : 'Cancelada pelo Administrador';
      updatePayload.notes = prevNotes ? `${prevNotes} | ${cancelTag}` : cancelTag;
    }

    if (newStatus === 'COMPLETED') {
      const trip = prevTrip;
      const company = state.companies.find(c => c.id === trip?.companyId);
      const days = (company?.paymentTerm === 'D15' ? 15 : company?.paymentTerm === 'D30' ? 30 : company?.paymentTerm === 'D60' ? 60 : 0);
      const nowMs = Date.now();
      updatePayload.completedAt = nowMs;
      updatePayload.dueDate = nowMs + (days * 86400000);
      updatePayload.commissionAvailableAt = updatePayload.dueDate;
    }
    await db.collection('trips').doc(tripId).update(updatePayload);

    if (prevTrip) {
      const updatedTrip = { ...prevTrip, ...updatePayload };
      // Cenário 3: Motorista aceitou a viagem
      if (newStatus === 'ACCEPTED' && (prevTrip.status === 'PENDING' || !prevTrip.status)) {
        const dName = (state.userProfile?.name || state.currentUser?.displayName) || updatedTrip.driverName || 'Motorista';
        notifyTripAcceptedByDriverWeb(updatedTrip, dName);
      }
      // Cenário 4: Viagem Iniciada (para Empresas e Administrador)
      if (newStatus === 'IN_PROGRESS' && prevTrip.status !== 'IN_PROGRESS') {
        const dName = (state.userProfile?.name || state.currentUser?.displayName) || updatedTrip.driverName || 'Motorista';
        notifyTripStartedWeb(updatedTrip, dName);
      }
      // Cenário 5: Empresa ou Administrador cancelou a viagem
      if (newStatus === 'CANCELLED') {
        const role = state.userProfile?.role || 'ADMIN';
        const name = state.userProfile?.name || 'Central';
        notifyTripCancelledWeb(updatedTrip, role, name);
      }
    }

    showToast(`Status atualizado para ${newStatus}!`, "success");
  } catch (err) {
    showToast("Erro ao atualizar status: " + err.message, "error");
  }
}

async function deleteTrip(tripId) {
  const trip = state.trips.find(t => t.id === tripId);
  const info = trip ? ` de ${trip.passengerName || 'Passageiro'} (${trip.companyName || 'Empresa'})` : '';
  if (!confirm(`Deseja realmente apagar definitivamente a viagem${info}? Esta ação removerá a corrida por completo do banco de dados e não pode ser desfeita.`)) return;
  try {
    await db.collection('trips').doc(tripId).delete();
    showToast("Viagem removida definitivamente com sucesso.", "info");
  } catch (err) {
    showToast("Erro ao excluir: " + err.message, "error");
  }
}

function getFilteredAdminFinancialTrips() {
  const filter = state.adminFinancialFilter;
  const now = new Date();

  return state.trips.filter(trip => {
    // Apenas viagens com valor / concluídas
    if (trip.status !== 'COMPLETED' && trip.status !== 'IN_PROGRESS' && trip.status !== 'ACCEPTED') return false;

    // Filtro por Empresa
    if (filter.companyId && trip.companyId !== filter.companyId) return false;

    // Filtro por Motorista
    if (filter.driverId && trip.driverId !== filter.driverId) return false;

    const tTime = Number(trip.completedAt || trip.scheduledTime || trip.createdAt || 0);
    if (!tTime) return filter.period === 'TODOS';

    const tripDate = new Date(tTime);

    if (filter.period === 'HOJE' || filter.period === 'DIARIO') {
      return tripDate.getFullYear() === now.getFullYear() &&
             tripDate.getMonth() === now.getMonth() &&
             tripDate.getDate() === now.getDate();
    }
    if (filter.period === 'SEMANAL') {
      const oneWeekAgo = new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000));
      return tripDate >= oneWeekAgo && tripDate <= now;
    }
    if (filter.period === 'MENSAL') {
      return tripDate.getFullYear() === now.getFullYear() &&
             tripDate.getMonth() === now.getMonth();
    }
    if (filter.period === 'ANUAL') {
      return tripDate.getFullYear() === now.getFullYear();
    }
    if (filter.period === 'CUSTOM') {
      let matchStart = true;
      let matchEnd = true;
      if (filter.startDate) {
        const start = new Date(filter.startDate + 'T00:00:00').getTime();
        matchStart = tTime >= start;
      }
      if (filter.endDate) {
        const end = new Date(filter.endDate + 'T23:59:59.999').getTime();
        matchEnd = tTime <= end;
      }
      return matchStart && matchEnd;
    }
    return true; // TODOS
  });
}

function exportAdminFinancialCSV() {
  const trips = getFilteredAdminFinancialTrips();
  if (trips.length === 0) {
    showToast("Nenhum registro para exportar com os filtros atuais.", "warning");
    return;
  }

  const headers = [
    "ID Viagem", "Data e Hora", "Empresa", "Motorista", "Passageiro",
    "Origem", "Destino", "Valor Total (R$)", "Comissão Motorista (R$)",
    "Fatura Empresa", "Repasse Motorista", "Status Corrida"
  ];

  const rows = trips.map(t => [
    `"${t.id || ''}"`,
    `"${formatDate(t.completedAt || t.scheduledTime)}"`,
    `"${(t.companyName || '').replace(/"/g, '""')}"`,
    `"${(t.driverName || 'N/A').replace(/"/g, '""')}"`,
    `"${(t.passengerName || '').replace(/"/g, '""')}"`,
    `"${(t.origin || '').replace(/"/g, '""')}"`,
    `"${(t.destination || '').replace(/"/g, '""')}"`,
    `"${(t.price || 0).toFixed(2).replace('.', ',')}"`,
    `"${(t.driverCommission || 0).toFixed(2).replace('.', ',')}"`,
    `"${t.companyPaymentStatus === 'PAID' ? 'RECEBIDO' : 'PENDENTE'}"`,
    `"${t.paymentStatus === 'PAID' ? 'PAGO' : 'PENDENTE'}"`,
    `"${t.status || 'COMPLETED'}"`
  ]);

  const csvContent = "\uFEFF" + [headers.join(";"), ...rows.map(r => r.join(";"))].join("\r\n");
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  const periodLabel = state.adminFinancialFilter.period.toLowerCase();
  link.setAttribute("download", `financeiro_administrativo_${periodLabel}_${new Date().toISOString().slice(0, 10)}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showToast("Relatório financeiro exportado com sucesso!", "success");
}

async function toggleCompanyPayment(tripId, markPaid) {
  try {
    await db.collection('trips').doc(tripId).update({
      companyPaymentStatus: markPaid ? 'PAID' : 'PENDING',
      companyPaidAt: markPaid ? Date.now() : null
    });
    if (markPaid) {
      const trip = state.trips.find(t => t.id === tripId);
      if (trip) notifyCompanyPaymentReceivedWeb(trip, trip.price);
    }
    showToast("Status da empresa atualizado!", "success");
  } catch (err) {
    showToast("Erro: " + err.message, "error");

}

async function toggleDriverPayment(tripId, markPaid) {
  try {
    await db.collection('trips').doc(tripId).update({
      paymentStatus: markPaid ? 'PAID' : 'PENDING',
      paidAt: markPaid ? Date.now() : null
    });
    if (markPaid) {

}

  state.liveMapFilter = filter;

function focusDriverOnMap(driverId, lat, lng) {
  state.selectedMapDriverId = driverId;
  if (liveMapInstance && lat && lng) {
    liveMapInstance.flyTo([lat, lng], 16, { animate: true, duration: 1 });
    if (liveMapMarkers[driverId]) {
      liveMapMarkers[driverId].openPopup();
    }
  }
}

function trackTripOnMap(tripId) {
  const trip = state.trips.find(t => t.id === tripId);
  if (!trip) {
    showToast("Viagem não encontrada.", "error");
    return;
  }
  setTab('live-map');
  if (trip.driverId) {
    const driver = state.drivers.find(d => d.id === trip.driverId);
    const loc = (state.driverLocations || []).find(l => l.driverId === trip.driverId);
    const lat = (loc && loc.latitude) ? loc.latitude : (driver?.latitude || -23.550520);
    const lng = (loc && loc.longitude) ? loc.longitude : (driver?.longitude || -46.633308);
    setTimeout(() => {
      focusDriverOnMap(trip.driverId, lat, lng);
    }, 400);
  } else {
    showToast("Esta viagem ainda não possui motorista atribuído.", "warning");
  }
}
